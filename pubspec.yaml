name: restaurant_app
description: Multi-role restaurant ordering and delivery app (Customer, Admin, Rider).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # Media
  image_picker: ^1.1.2

  # Payments
  flutter_stripe: ^11.1.0
  http: ^1.2.2

  # Navigation / maps
  url_launcher: ^6.3.1

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Functional error handling
  dartz: ^0.10.1

  # DI
  get_it: ^7.7.0

  # Local persistence (cart)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

